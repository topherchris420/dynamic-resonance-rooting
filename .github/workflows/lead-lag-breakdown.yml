name: Lead-lag breakdown replay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-breakdown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned numerical environment
        run: python -m pip install -e ".[dev]" -c experiments/financial_holdout/requirements.txt
      - name: Verify causal timing and evidence
        run: python -m pytest tests/test_lead_lag_breakdown.py -q
      - name: Replay calibration without holdout outcomes
        run: >-
          python scripts/run_breakdown_study.py calibrate
          --output-dir /tmp/breakdown-calibration
      - name: Check calibration checksums, thresholds and every replayed row
        run: >-
          python scripts/verify_breakdown_calibration.py
          /tmp/breakdown-calibration experiments/lead_lag_breakdown/calibration
      - name: Replay every held-out episode and market result
        run: >-
          python scripts/run_breakdown_study.py evaluate
          --calibration-dir /tmp/breakdown-calibration
          --output-dir /tmp/breakdown-results
          --verify-against results/expected/lead_lag_breakdown
      - name: Preserve all results including negative findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lead-lag-breakdown-evidence
          path: |
            /tmp/breakdown-calibration
            /tmp/breakdown-results
          retention-days: 90
          if-no-files-found: error
