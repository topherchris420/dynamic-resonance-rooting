name: v3 reconstruction replay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned numerical environment
        run: python -m pip install -e ".[dev]" -c experiments/financial_holdout/requirements.txt
      - name: Verify operators and the committed artifact
        run: python -m pytest tests/test_v3_reconstruction.py -q
      - name: Replay every registered v3 study and compare with the committed artifact
        run: >-
          python scripts/run_v3_reconstruction.py
          --workers 4
          --output /tmp/v3-reconstruction/v3_reconstruction.json
          --verify-against results/expected/v3_reconstruction/v3_reconstruction.json
      - name: Preserve the replayed artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: v3-reconstruction-replay
          path: /tmp/v3-reconstruction
          retention-days: 90
          if-no-files-found: error
