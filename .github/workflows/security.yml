name: Security and supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/phase-*"]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan tracked files for high-confidence secrets
        run: python scripts/check_secrets.py

  dependency-audit-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[contingency]"
          python -m pip install "pip-audit>=2.7,<3" "cyclonedx-bom>=4,<8"
      - name: Audit installed Python dependencies
        run: pip-audit --desc
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --of JSON -o sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: drr-python-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
