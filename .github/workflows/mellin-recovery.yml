name: DRR-Mellin recovery replay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned numerical environment
        run: python -m pip install -e ".[dev]" -c experiments/financial_holdout/requirements.txt
      - name: Verify operators, statistics and the committed artifact
        run: python -m pytest tests/test_mellin.py tests/test_mellin_recovery_benchmark.py -q
      - name: Replay every development and held-out trial
        run: >-
          python scripts/run_mellin_recovery_benchmark.py
          --workers 4
          --output-dir /tmp/mellin-recovery
          --verify-against results/expected/mellin_recovery
      - name: Preserve all results including unsupported hypotheses
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mellin-recovery-replay
          path: /tmp/mellin-recovery
          retention-days: 90
          if-no-files-found: error
