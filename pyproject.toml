[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drr-framework"
version = "4.3.0"
description = "Dynamic Resonance Rooting research framework for complex adaptive systems"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Christopher Woodyard" }
]
keywords = [
  "complex-adaptive-systems",
  "resonance-detection",
  "rooting-analysis",
  "phase-transition",
  "state-space-models",
  "scientific-computing",
  "reproducible-research",
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "scikit-learn",
  "networkx",
  "pandas",
  "seaborn",
  "jupyter",
  "notebook",
  "pyinform",
  "PyYAML"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
contingency = [
  # Release 0.2.3 uses Python 3.12 syntax despite declaring >=3.11.
  "contingency-tools==0.2.3; python_version >= '3.12'",
  # Imported by the released package but omitted from its dependency metadata.
  "beartype>=0.21,<0.23; python_version >= '3.12'",
]
econometrics = [
  "statsmodels>=0.14,<0.14.2; python_version < '3.9'",
  "statsmodels>=0.14.4,<0.15; python_version >= '3.9'",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6",
  "black>=24.8,<25",
  "mypy>=1.10,<2.4",
  "pre-commit>=3.5,<5",
]
quant-data = [
  "openbb",
]
quant-risk = [
  "riskfolio-lib",
]
quant-ml = [
  "pyqlib",
]
quant-validation = [
  "vectorbt",
]
quant = [
  "openbb",
  "riskfolio-lib",
  "pyqlib",
  "vectorbt",
]
judgment = [
  # Official TypeSafe SDK. Python 3.10+ only; older runtimes keep local-only mode.
  "typesafe-sdk>=0.7.1,<0.8; python_version >= '3.10'",
]

[project.scripts]
drr-reproduce = "drr_framework.experiments:main"
drr-monitor = "drr_framework.supervisory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drr_framework.supervisory" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100
extend-exclude = "notebooks|tableau_calculated_fields.py|layer2_tableau_blueprint.twb|layer1_regulatory_backend.py"
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["src", "examples", "scripts", "tests"]
extend-exclude = ["notebooks", "paper/legacy-prototype-fragment.md", "tableau_calculated_fields.py", "layer2_tableau_blueprint.twb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "E402",
  "F401",
  "F541",
  "F841",
  "B007",
]

[tool.mypy]
python_version = "3.10"
files = ["src/drr_framework"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
